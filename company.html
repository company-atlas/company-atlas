<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Atlas</title>
<meta name="robots" content="noindex">
<script>
  // 예전 주소(company.html?id=samsung)로 들어오면 새 주소(company/samsung/)로 옮겨 줘요
  var id = new URLSearchParams(location.search).get('id') || '';
  var file = location.protocol === 'file:' ? 'index.html' : '';
  location.replace(id ? 'company/' + encodeURIComponent(id) + '/' + file : 'index.html');
</script>
</head>
<body></body>
</html>
