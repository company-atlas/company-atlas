# 매일 아침 기업 자료를 새로 받아 사이트를 다시 만들어요.
# GitHub의 Actions 탭에서 "Run workflow" 버튼으로 바로 실행할 수도 있어요.
name: 기업 자료 업데이트

on:
  schedule:
    - cron: '17 21 * * *'   # 매일 한국 시간 오전 6시 17분
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 자료 받고 사이트 만들기
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/update.py

      - name: 바뀐 내용 저장하기
        if: always()
        run: |
          git config user.name "company-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data company sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
          else
            git commit -m "기업 자료 자동 업데이트"
            git push
          fi

      - name: 사이트 화면에 반영하기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            || echo "사이트 화면 반영 요청에 실패했어요. 다음에 파일을 올릴 때 반영돼요."
