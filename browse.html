<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체 보기 · Company Atlas</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Company Atlas">
<meta property="og:title" content="전체 보기 · Company Atlas">
<meta property="og:description" content="한국·미국 상장사 실적과 사업을 한눈에 쉽게 정리했어요.">
<meta property="og:image" content="https://company-atlas.github.io/company-atlas/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-shell">
  <header id="site-header"></header>

  <main class="wrap page">
    <h1 style="font-size: 28px">전체 보기</h1>
    <div class="tabs" role="group" aria-label="보기 기준">
      <button type="button" class="tab" id="tab-country" aria-pressed="true">국가별</button>
      <button type="button" class="tab" id="tab-industry" aria-pressed="false">산업별</button>
    </div>
    <div style="max-width: 480px; display: flex">
      <label class="sr-only" for="filter">이름으로 찾기</label>
      <input class="input" id="filter" type="search" placeholder="국가 이름으로 찾기" style="flex: 1; height: 44px; font-size: 15px">
    </div>
    <div class="small muted">가나다순 정렬</div>
    <div class="grid-list" id="browse-list"></div>
  </main>

  <footer id="site-footer"></footer>
</div>

<script src="data/companies.js"></script>
<script src="js/common.js"></script>
<script src="js/browse.js"></script>
</body>
</html>
